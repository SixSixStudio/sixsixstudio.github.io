<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0B0B0E;font-family:Inter,system-ui,sans-serif;color:#F4F2EC;
    display:grid;place-items:center}
  .app{width:min(92vw,900px);border:1px solid rgba(244,242,236,.12);border-radius:16px;overflow:hidden;
    background:#101014;box-shadow:0 40px 120px rgba(0,0,0,.6)}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid rgba(244,242,236,.08)}
  .bar i{width:9px;height:9px;border-radius:50%;background:#2A2A30;display:block}
  .bar span{margin-left:auto;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7B7B76}
  .body{display:grid;grid-template-columns:0.9fr 1fr;gap:20px;padding:18px 20px 20px}
  .thumb{aspect-ratio:1/1;border-radius:10px;background:
     radial-gradient(120% 90% at 25% 20%,#FFFA00 0%,#7a6f00 22%,#1a1606 55%,#0a0a0c 100%)}
  .meta{display:flex;flex-direction:column;justify-content:center;gap:10px}
  .meta h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .line{height:10px;border-radius:6px;background:#1C1C22}
  .line.s{width:70%}
  .row{display:flex;gap:8px;margin-top:6px}
  .chip{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9A9A93;
    border:1px solid rgba(244,242,236,.14);border-radius:999px;padding:7px 12px}
  .btn{margin-top:10px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:#FFFA00;color:#08080A;font-weight:700;font-size:15px;letter-spacing:-.01em;
    border-radius:999px;padding:12px 26px;box-shadow:0 10px 40px rgba(255,250,0,.25)}
  .ok{width:18px;height:18px;border-radius:50%;background:#08080A;display:grid;place-items:center}
  .ok svg{width:11px;height:11px;fill:#FFFA00}
</style></head>
<body>
  <div class="app">
    <div class="bar"><i></i><i></i><i></i><span>New post</span></div>
    <div class="body">
      <div class="thumb"></div>
      <div class="meta">
        <h3>Ready to go live</h3>
        <div class="line"></div><div class="line s"></div>
        <div class="row"><span class="chip">Reel</span><span class="chip">3 platforms</span></div>
        <div class="btn"><span class="ok"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>Publish</div>
      </div>
    </div>
  </div>
</body></html>
